[project]
name = "docugraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymupdf", "reportlab", "numpy", "opencv-python-headless", "rapidocr", "onnxruntime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docugraph"]
[project]
name = "docugraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymupdf", "fastapi", "uvicorn", "langgraph","reportlab", "numpy", "opencv-python-headless", "rapidocr", "onnxruntime", "docling", "psycopg[binary]", "pgvector", "sentence-transformers", "python-dotenv","rank-bm25","ollama", "neo4j"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docugraph"]

[project.optional-dependencies]
dev = ["pytest","httpx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: needs OCR or Docling models and generated scans; run locally"]